/* SIDEBAR NAVIGATION */
#sidebar {
    width: 320px;
    background: #091a24;
    border-right: 2px solid #234252;
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
}

.sidebar-header {

}

.sidebar-header h2 {

    margin-bottom: 5px;
}

.sidebar-header p {
    font-size: 12px;
    color: #94a3b8;
}

.course-toc {
    flex-grow: 1;
    overflow-y: auto;
    padding: 15px;
}

.unit-title {
    font-size: 11px;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #38bdf8;
    margin: 15px 0 8px 5px;
}

.toc-item {
    display: block;
    width: 100%;
    text-align: left;
    background: #0f2c3b;
    color: #d1d5db;
    border: 1px solid #23495d;
    padding: 12px 14px;
    border-radius: 7px;
    margin-bottom: 8px;
    font-size: 13px;
    line-height: 1.4;
    cursor: pointer;
    transition: all 0.2s ease;
}

.toc-item:hover {
    background: #19465c;
    color: #ffffff;
    border-color: #38bdf8;
}

.toc-item.active {
    background: #0284c7;
    color: #ffffff;
    border-color: #38bdf8;
    font-weight: bold;
    box-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
}

/* CONTENT VIEWPORT (IFRAME) */
#content-area {
    flex-grow: 1;
    height: 100vh;
    background: #071017;
}

iframe {
    width: 100%;
    height: 100%;
    border: none;
}
</style>

<script>
function loadChapter(button, htmlFile) {
    // 1. Update the iframe source to load the selected chapter
    document.getElementById("chapterViewer").src = htmlFile;

    // 2. Manage active button highlighting in sidebar
    const buttons = document.querySelectorAll('.toc-item');
    buttons.forEach(btn => btn.classList.remove('active'));
    button.classList.add('active');
}
</script>
